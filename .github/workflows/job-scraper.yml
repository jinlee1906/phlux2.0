name: Job Scraper

on:
  push:
    branches:
      - main
  # Enabled 2026-09-22 at the user's explicit request (PROJECT_BRIEF.md
  # Phase 9 cadence: once each weekday morning, not the ~15-runs/day
  # schedule this repo inherited from the upstream project).
  #
  # Minute deliberately NOT :00 -- GitHub's own docs warn that on-the-hour
  # schedules queue behind everyone else's on-the-hour schedules and can be
  # delayed significantly. Confirmed here: both 2026-09-23 and 2026-09-24's
  # runs (cron was '0 13 * * 1-5') fired ~4h45m late (17:4x UTC instead of
  # 13:00 UTC) two days running -- a consistent pattern, not one-off load.
  schedule:
    - cron: '17 13 * * 1-5'
  workflow_dispatch:

concurrency:
  group: job-scraper
  cancel-in-progress: false

permissions:
  contents: write

env:
  GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
  ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: true

      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Scrape jobs
        run: .venv/bin/python main.py

      - name: Generate README
        run: .venv/bin/python generate_readme.py

      - name: Commit results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # storage.json/README.md/data/ are fully regenerated from a fresh
          # live fetch every run, not hand-edited -- there's nothing to
          # line-merge between two runs' versions of them. Re-basing this
          # onto whatever landed on main while this run's ~30min scrape was
          # in flight caused a real, unresolvable conflict (a race the
          # concurrency group above narrows but can't fully close, since a
          # commit can land in the gap between this job's own checkout and
          # another run's push). Fix: re-sync to main's current tip right
          # before committing, then re-commit *this run's* generated files
          # on top of it -- last-writer-wins for generated data, no merge.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --soft origin/main
            git add storage.json README.md data/
            if git diff --cached --quiet; then
              echo "No changes to commit"
              break
            fi
            git commit -m "Update storage.json and readme [bot]"
            if git push origin HEAD:main; then
              break
            fi
            echo "Push race on attempt $attempt, retrying..."
            git reset --soft HEAD^
            sleep 5
          done

  retry:
    needs: run
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Wait before retry
        run: sleep 300

      - uses: actions/checkout@v3
        with:
          persist-credentials: true

      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Scrape jobs (retry)
        run: .venv/bin/python main.py

      - name: Generate README
        run: .venv/bin/python generate_readme.py

      - name: Commit results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # storage.json/README.md/data/ are fully regenerated from a fresh
          # live fetch every run, not hand-edited -- there's nothing to
          # line-merge between two runs' versions of them. Re-basing this
          # onto whatever landed on main while this run's ~30min scrape was
          # in flight caused a real, unresolvable conflict (a race the
          # concurrency group above narrows but can't fully close, since a
          # commit can land in the gap between this job's own checkout and
          # another run's push). Fix: re-sync to main's current tip right
          # before committing, then re-commit *this run's* generated files
          # on top of it -- last-writer-wins for generated data, no merge.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --soft origin/main
            git add storage.json README.md data/
            if git diff --cached --quiet; then
              echo "No changes to commit"
              break
            fi
            git commit -m "Update storage.json and readme [bot]"
            if git push origin HEAD:main; then
              break
            fi
            echo "Push race on attempt $attempt, retrying..."
            git reset --soft HEAD^
            sleep 5
          done
