name: Job Scraper

on:
  push:
    branches:
      - main
  # Enabled 2026-09-22 at the user's explicit request (PROJECT_BRIEF.md
  # Phase 9 cadence: once each weekday morning, not the ~15-runs/day
  # schedule this repo inherited from the upstream project).
  schedule:
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

concurrency:
  group: job-scraper
  cancel-in-progress: false

permissions:
  contents: write

env:
  GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
  ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: true

      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Scrape jobs
        run: .venv/bin/python main.py

      - name: Generate README
        run: .venv/bin/python generate_readme.py

      - name: Commit results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add storage.json README.md data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update storage.json and readme [bot]"
            git pull --rebase origin main
            git push
          fi

  retry:
    needs: run
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Wait before retry
        run: sleep 300

      - uses: actions/checkout@v3
        with:
          persist-credentials: true

      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Scrape jobs (retry)
        run: .venv/bin/python main.py

      - name: Generate README
        run: .venv/bin/python generate_readme.py

      - name: Commit results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add storage.json README.md data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update storage.json and readme [bot]"
            git pull --rebase origin main
            git push
          fi
